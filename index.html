	<meta property="og:title" content="স্মার্ট স্কুল ম্যানেজমেন্ট সিস্টেম" />
	<meta property="og:description"
		content="বাংলাদেশের শিক্ষাপ্রতিষ্ঠানের জন্য সম্পূর্ণ ডিজিটাল সমাধান — সময় বাঁচান, খরচ কমান।" />

	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<meta http-equiv="Content-Security-Policy"
		content="default-src 'self' https://fonts.maateen.me https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.maateen.me https://fonts.googleapis.com; frame-src https://qms.eu5.org; img-src 'self' data:; connect-src 'self';">

	<title>স্মার্ট স্কুল ম্যানেজমেন্ট সিস্টেম | NeedleCode IT Services</title>
	<style>
		html {
			margin: 0px;
			padding: 0px;
			width: 100vw;
			height: 100vh;
		}

		body {
			position: relative;
			margin: 0px;
			padding: 0px;
			width: 100%;
			height: 100%;
		}
	</style>
</head>

<body>
	<iframe id="ssmsFrame" src="https://qms.eu5.org/ssms/"
		style="width:100%; height:100vh; border: none; outline: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; max-width: 100%; max-height: 100%; overflow: auto; z-index: 1;"
		allow="
        accelerometer;
        autoplay;
        camera;
        clipboard-read;
        clipboard-write;
        display-capture;
        encrypted-media;
        fullscreen;
        geolocation;
        gyroscope;
        microphone;
        midi;
        payment;
        picture-in-picture;
        publickey-credentials-get;
        screen-wake-lock;
        usb;
        web-share;
        xr-spatial-tracking
    " sandbox="
        allow-downloads
        allow-forms
        allow-modals
        allow-orientation-lock
        allow-pointer-lock
        allow-popups
        allow-popups-to-escape-sandbox
        allow-presentation
        allow-same-origin
        allow-scripts
        allow-storage-access-by-user-activation
        allow-top-navigation
        allow-top-navigation-by-user-activation
    " allowfullscreen></iframe>

	<script>
		const iframe = document.getElementById('ssmsFrame');
		const IFRAME_ORIGIN = 'https://qms.eu5.org';
		const IFRAME_BASE = '/ssms';

		window.addEventListener('message', (event) => {
			if (event.origin !== IFRAME_ORIGIN) return;
			if (event.data?.type === 'ssms:url') {
				const path = event.data.path || '/';
				const newUrl = path.startsWith('/') ? path : `/${path}`;
				const current = window.location.pathname + window.location.search + window.location.hash;
				if (current !== newUrl) window.history.pushState({}, '', newUrl);
			} else if (event.data?.type !== 'ssms:parentorigin') {
				iframe.contentWindow.postMessage(
					{
						type: 'ssms:parentorigin',
						origin: window.location.origin
					},
					'https://qms.eu5.org'
				);
			}
		});

		function getParentRelativeUrl() {
			return (window.location.pathname + window.location.search + window.location.hash);
		}

		function syncParentToIframe() {
			const path = getParentRelativeUrl();

			iframe.contentWindow.postMessage(
				{
					type: 'ssms:navigate',
					path
				},
				'https://qms.eu5.org'
			);
		}

		iframe.addEventListener('load', syncParentToIframe);
		window.addEventListener('popstate', syncParentToIframe);
		window.addEventListener('hashchange', syncParentToIframe);
	</script>
</body>
</html>
