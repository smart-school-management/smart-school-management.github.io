	<style>
		html{
			margin: 0px;
			padding: 0px;

		body{
			position: relative;
			margin: 0px;

			width: 100%;
			height: 100%;
		}
	</style>
</head>

<body>
	<iframe id="ssmsFrame" src="https://qms.eu5.org/ssms/" sandbox="allow-scripts allow-same-origin" style="width:100%; height:100vh; border: none; outline: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; max-width: 100%; max-height: 100%; overflow: auto; z-index: 1;"></iframe>

	<script>
		const iframe = document.getElementById('ssmsFrame');
		const IFRAME_ORIGIN = 'https://qms.eu5.org';
		const IFRAME_BASE = '/ssms';

		window.addEventListener('message', (event) => {
			if (event.origin !== IFRAME_ORIGIN) return;
			if (event.data?.type !== 'ssms:url') return;
			const path = event.data.path || '/';
			const newUrl = path.startsWith('/') ? path : `/${path}`;
			const current = window.location.pathname + window.location.search + window.location.hash;
			if (current !== newUrl) window.history.pushState( {}, '', newUrl );
		});

		function getParentRelativeUrl() {
			return ( window.location.pathname + window.location.search + window.location.hash );
		}

		function syncParentToIframe() {
			const path = getParentRelativeUrl();

			iframe.contentWindow.postMessage(
				{
					type: 'ssms:navigate',
					path
				},
				'https://qms.eu5.org'
			);
		}

		iframe.addEventListener('load', syncParentToIframe);
		window.addEventListener('popstate', syncParentToIframe);
		window.addEventListener('hashchange', syncParentToIframe);
	</script>
</body>
